<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask + Three.js Memory Game</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-dark bg-black border-bottom border-secondary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">3D Memory Game</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-3">
            <div class="col-12 d-flex flex-wrap gap-3 align-items-center">
                <span class="badge bg-primary fs-6">Moves: <span id="moves-count">0</span></span>
                <span class="badge bg-success fs-6">Matches: <span id="matches-count">0</span> / 8</span>
                <button id="btn-restart" class="btn btn-outline-light btn-sm ms-auto">Restart</button>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card bg-secondary bg-opacity-25 border-secondary">
                    <div class="card-body p-0">
                        <div id="scene-container" class="w-100" style="height: 600px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="win-banner" class="alert alert-success mt-3 d-none" role="alert">
            🎉 You won in <span id="win-moves"></span> moves! Click Restart to play again.
        </div>
    </div>

    <!-- Bootstrap JS Bundle (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Three.js (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ---------- Config ----------
        const GRID_COLS = 4;
        const GRID_ROWS = 4;
        const CARD_SIZE = 1.3;
        const CARD_GAP = 0.25;
        const SYMBOLS = ['★', '♦', '●', '▲', '■', '♥', '✿', '☀'];
        const SYMBOL_COLORS = [
            0xff6b6b, 0x4dabf7, 0x51cf66, 0xffd43b,
            0xcc5de8, 0xff922b, 0x20c997, 0xf06595
        ];

        // ---------- State ----------
        let scene, camera, renderer, raycaster, mouse;
        let cardGroup = [];
        let flippedCards = [];
        let matchedIds = [];
        let isBusy = false;
        let moves = 0;
        let matches = 0;

        const container = document.getElementById('scene-container');
        const movesEl = document.getElementById('moves-count');
        const matchesEl = document.getElementById('matches-count');
        const winBanner = document.getElementById('win-banner');
        const winMovesEl = document.getElementById('win-moves');

        // ---------- Texture helpers ----------
        function makeCardTexture(symbol, color, isFace) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            if (isFace) {
                ctx.fillStyle = '#f8f9fa';
                ctx.fillRect(0, 0, 256, 256);
                ctx.strokeStyle = '#212529';
                ctx.lineWidth = 8;
                ctx.strokeRect(8, 8, 240, 240);
                ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
                ctx.font = 'bold 140px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbol, 128, 138);
            } else {
                ctx.fillStyle = '#0d6efd';
                ctx.fillRect(0, 0, 256, 256);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 6;
                ctx.strokeRect(20, 20, 216, 216);
                ctx.strokeRect(40, 40, 176, 176);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 60px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('?', 128, 138);
            }
            return new THREE.CanvasTexture(canvas);
        }

        // ---------- Build deck ----------
        function buildDeck() {
            let deck = [];
            SYMBOLS.forEach((sym, i) => {
                deck.push({ symbol: sym, color: SYMBOL_COLORS[i] });
                deck.push({ symbol: sym, color: SYMBOL_COLORS[i] });
            });
            // Shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        // ---------- Scene setup ----------
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1d29);

            camera = new THREE.PerspectiveCamera(
                50, container.clientWidth / container.clientHeight, 0.1, 100
            );
            camera.position.set(0, 6.5, 6.5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(3, 8, 5);
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('click', onClick);
            window.addEventListener('resize', onResize);
        }

        function onResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // ---------- Build cards ----------
        function buildCards() {
            cardGroup.forEach(c => scene.remove(c.mesh));
            cardGroup = [];
            flippedCards = [];
            matchedIds = [];
            isBusy = false;
            moves = 0;
            matches = 0;
            movesEl.textContent = moves;
            matchesEl.textContent = matches;
            winBanner.classList.add('d-none');

            const deck = buildDeck();
            const totalWidth = GRID_COLS * (CARD_SIZE + CARD_GAP);
            const totalHeight = GRID_ROWS * (CARD_SIZE + CARD_GAP);
            const startX = -totalWidth / 2 + CARD_SIZE / 2;
            const startZ = -totalHeight / 2 + CARD_SIZE / 2;

            deck.forEach((cardData, index) => {
                const col = index % GRID_COLS;
                const row = Math.floor(index / GRID_COLS);

                const geometry = new THREE.BoxGeometry(CARD_SIZE, 0.12, CARD_SIZE);
                const backTexture = makeCardTexture(null, 0, false);
                const faceTexture = makeCardTexture(cardData.symbol, cardData.color, true);

                const materials = [
                    new THREE.MeshStandardMaterial({ color: 0x343a40 }), // right
                    new THREE.MeshStandardMaterial({ color: 0x343a40 }), // left
                    new THREE.MeshStandardMaterial({ map: faceTexture }), // top (face up)
                    new THREE.MeshStandardMaterial({ map: backTexture }), // bottom (back, shown initially)
                    new THREE.MeshStandardMaterial({ color: 0x343a40 }), // front
                    new THREE.MeshStandardMaterial({ color: 0x343a40 })  // back
                ];

                const mesh = new THREE.Mesh(geometry, materials);
                mesh.position.set(
                    startX + col * (CARD_SIZE + CARD_GAP),
                    0,
                    startZ + row * (CARD_SIZE + CARD_GAP)
                );
                // Start "face down" — rotate 180° on Z so texture[3] (back) faces up
                mesh.rotation.z = Math.PI;

                scene.add(mesh);

                cardGroup.push({
                    id: index,
                    symbol: cardData.symbol,
                    mesh: mesh,
                    isFlipped: false,
                    isMatched: false
                });
            });
        }

        // ---------- Interaction ----------
        function onClick(event) {
            if (isBusy) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = cardGroup.map(c => c.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const card = cardGroup.find(c => c.mesh === clickedMesh);
                if (card && !card.isFlipped && !card.isMatched) {
                    flipCard(card);
                }
            }
        }

        function flipCard(card) {
            card.isFlipped = true;
            animateFlip(card.mesh, Math.PI, 0, 300);
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                isBusy = true;
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        function animateFlip(mesh, fromZ, toZ, duration) {
            const startTime = performance.now();
            function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                mesh.rotation.z = fromZ + (toZ - fromZ) * t;
                if (t < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function checkMatch() {
            const [a, b] = flippedCards;
            if (a.symbol === b.symbol) {
                setTimeout(() => {
                    a.isMatched = true;
                    b.isMatched = true;
                    matches++;
                    matchesEl.textContent = matches;
                    flippedCards = [];
                    isBusy = false;

                    if (matches === SYMBOLS.length) {
                        winMovesEl.textContent = moves;
                        winBanner.classList.remove('d-none');
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    a.isFlipped = false;
                    b.isFlipped = false;
                    animateFlip(a.mesh, 0, Math.PI, 300);
                    animateFlip(b.mesh, 0, Math.PI, 300);
                    flippedCards = [];
                    setTimeout(() => { isBusy = false; }, 320);
                }, 800);
            }
        }

        // ---------- Render loop ----------
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // ---------- Init ----------
        initScene();
        buildCards();
        animate();

        document.getElementById('btn-restart').addEventListener('click', buildCards);
    </script>
</body>
</html>
